name: Test Functions

on:
  push:
    paths:
      - "invoice-tracker-functions/**"
      - ".github/workflows/test-functions.yml"
  pull_request:
    paths:
      - "invoice-tracker-functions/**"
      - ".github/workflows/test-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: invoice-tracker-functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: invoice-tracker-functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
